    <script type="text/javascript">
      // Self-contained fullscreen blur-crossfade slideshow.
      // No external dependencies (no jQuery / Modernizr / StackBlur), so it
      // works over HTTPS on GitHub Pages with no mixed-content or 404 issues.
      (function () {
        "use strict";

        var INTERVAL = 10000; // CUSTOM: 10000 ms between slides (must be more than FADE)
        var FADE = 4000; // CUSTOM: 4000 ms crossfade duration
        var BLUR = 24; // CUSTOM: 24 px blur at the peak of the transition

        var wrapper = document.getElementById("bx-wrapper");
        var loading = wrapper.querySelector(".bx-loading");
        var container = wrapper.querySelector(".bx-container");
        var imgs = Array.prototype.slice.call(
          container.querySelectorAll("img"),
        );
        var total = imgs.length;
        var current = 0;
        var isAnim = false;

        var canAnimate =
          typeof Element !== "undefined" &&
          typeof Element.prototype.animate === "function";

        function hideLoader() {
          if (loading) {
            loading.style.display = "none";
          }
        }

        if (!total) {
          hideLoader();
          return;
        }

        // Start as soon as the FIRST image is ready, rather than waiting for
        // all 30. The rest keep loading in the background (they're already in
        // the DOM), so paint/LCP happens the moment image 1 is decoded.
        var started = false;
        function begin() {
          if (started) {
            return;
          }
          started = true;
          start();
        }
        var first = imgs[0];
        if (first.complete && first.naturalWidth) {
          begin();
        } else {
          first.addEventListener("load", begin);
          first.addEventListener("error", begin); // don't hang on a bad first image
        }

        function start() {
            var FIRST_IMAGE_LINGER_MS = 3000; // CUSTOM: first image holds 3s instead of 8s
          imgs[current].style.opacity = 1;
          imgs[current].style.zIndex = 101;
          hideLoader();
          if (total > 1) {
            setTimeout(next, FIRST_IMAGE_LINGER_MS);
            setInterval(next, INTERVAL);
          }
        }

        function next() {
          if (isAnim) {
            return;
          }
          isAnim = true;

          var out = imgs[current];
          current = (current + 1) % total;
          var into = imgs[current];

          if (!canAnimate) {
            // Graceful fallback: instant swap, no blur.
            out.style.opacity = 0;
            out.style.zIndex = 100;
            into.style.opacity = 1;
            into.style.zIndex = 101;
            isAnim = false;
            return;
          }

          out.style.zIndex = 100;
          into.style.zIndex = 101;

          var opts = {
            duration: FADE,
            easing: "ease-in-out",
            fill: "forwards",
          };

          out.animate(
            [
              { opacity: 1, filter: "blur(0px)" },
              { opacity: 0, filter: "blur(" + BLUR + "px)" },
            ],
            opts,
          );

          var enter = into.animate(
            [
              { opacity: 0, filter: "blur(" + BLUR + "px)" },
              { opacity: 1, filter: "blur(0px)" },
            ],
            opts,
          );

          enter.onfinish = function () {
            into.style.opacity = 1;
            into.style.filter = "none";
            out.style.opacity = 0;
            out.style.filter = "none";
            isAnim = false;
          };
        }
      })();
    </script>

    <!-- Ambient background music (optional).
             Track: "The Mountain" via Pixabay (pixabay.com track 146145).
             Pixabay Content License; check the license .txt in /music for any
             attribution the artist requests. Autoplay with sound is blocked by
             browsers until the user interacts, so playback starts via the toggle. -->
    <audio
      id="bx-audio"
      src="music/the_mountain-data-science-146145.mp3"
      loop
      preload="none"
    ></audio>
    <button
      id="bx-audio-toggle"
      type="button"
      aria-label="Play background music"
      aria-pressed="false"
    >
      <span class="bx-audio-icon" aria-hidden="true">&#9834;</span>
    </button>

    <script type="text/javascript">
      // Minimal, dependency-free background-music toggle.
      (function () {
        "use strict";
        var audio = document.getElementById("bx-audio");
        var btn = document.getElementById("bx-audio-toggle");
        if (!audio || !btn) {
          return;
        }
        var icon = btn.querySelector(".bx-audio-icon");

        function setState(playing) {
          btn.classList.toggle("is-playing", playing);
          btn.setAttribute("aria-pressed", playing ? "true" : "false");
          btn.setAttribute(
            "aria-label",
            playing ? "Pause background music" : "Play background music",
          );
          icon.innerHTML = playing ? "&#10074;&#10074;" : "&#9834;"; // pause bars : music note
        }

        btn.addEventListener("click", function () {
          if (audio.paused) {
            audio.play().catch(function () {
              setState(false);
            });
          } else {
            audio.pause();
          }
        });

        audio.addEventListener("play", function () {
          setState(true);
        });
        audio.addEventListener("pause", function () {
          setState(false);
        });

        // Try a gentle autoplay; most browsers block audible autoplay, in
        // which case it simply stays paused until the user clicks the button.
        var attempt = audio.play();
        if (attempt && typeof attempt.then === "function") {
          attempt.catch(function () {
            setState(false);
          });
        }
      })();
    </script>
